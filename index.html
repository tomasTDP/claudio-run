<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Runner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1f;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', -apple-system, sans-serif;
    }
    #game {
      text-align: center;
    }
    #score-bar {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
      padding: 10px 20px;
      color: #666;
      font-size: 16px;
      font-family: 'Courier New', monospace;
    }
    #score-bar span { color: #888; }
    #canvas {
      background: #1a1a1f;
      display: block;
    }
    #hint {
      color: #444;
      font-size: 12px;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div id="game">
    <div id="score-bar">
      <div>HI <span id="hi">00000</span></div>
      <div><span id="score">00000</span></div>
    </div>
    <canvas id="canvas" width="800" height="250"></canvas>
    <div id="hint">Press SPACE or tap to jump</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const hiEl = document.getElementById('hi');

    let state = 'waiting'; // waiting, playing, dead
    let score = 0, highScore = 0;
    let speed = 8, frame = 0;
    let groundX = 0;

    const claude = {
      x: 80,
      y: 160,
      baseY: 160,
      vy: 0,
      grounded: true,
      runFrame: 0,
      eyeBlink: 0
    };

    const gravity = 0.9;
    const jumpForce = -16;

    let prompts = [];
    let coffees = [];
    let clouds = [];

    const promptTexts = [
      { text: '🔥 URGENT', color: '#f97316' },
      { text: '📧 Reply ASAP', color: '#ef4444' },
      { text: '🙏 Quick favor', color: '#ec4899' },
      { text: '⚡ Need this now', color: '#f59e0b' },
      { text: '😤 Fix this bug', color: '#dc2626' },
      { text: '📋 New task', color: '#8b5cf6' },
      { text: '💬 Can we talk?', color: '#06b6d4' },
      { text: '🚨 Production down', color: '#ef4444' },
    ];

    function init() {
      prompts = [];
      coffees = [];
      clouds = [];
      score = 0;
      speed = 8;
      frame = 0;
      claude.y = claude.baseY;
      claude.vy = 0;
      claude.grounded = true;

      // Initial clouds
      for (let i = 0; i < 4; i++) {
        clouds.push({
          x: 150 + i * 200,
          y: 30 + Math.random() * 50
        });
      }
    }

    function formatScore(n) {
      return String(Math.floor(n)).padStart(5, '0');
    }

    function spawnPrompt() {
      const type = promptTexts[Math.floor(Math.random() * promptTexts.length)];
      const height = 30 + Math.random() * 20;
      prompts.push({
        x: 850,
        y: 195 - height,
        width: 100 + Math.random() * 40,
        height: height,
        text: type.text,
        color: type.color,
        passed: false
      });
    }

    function spawnCoffee() {
      coffees.push({
        x: 850,
        y: 100 + Math.random() * 50,
        collected: false
      });
    }

    function jump() {
      if (state === 'waiting') {
        state = 'playing';
        init();
        return;
      }
      if (state === 'dead') {
        state = 'playing';
        init();
        return;
      }
      if (claude.grounded) {
        claude.vy = jumpForce;
        claude.grounded = false;
      }
    }

    function update() {
      if (state !== 'playing') return;
      frame++;

      // Claude physics
      claude.vy += gravity;
      claude.y += claude.vy;
      if (claude.y >= claude.baseY) {
        claude.y = claude.baseY;
        claude.vy = 0;
        claude.grounded = true;
      }

      // Animation
      if (claude.grounded) {
        claude.runFrame = Math.floor(frame / 5) % 2;
      }
      claude.eyeBlink = Math.random() < 0.01 ? 8 : Math.max(0, claude.eyeBlink - 1);

      // Speed increase
      if (frame % 500 === 0 && speed < 16) speed += 0.5;

      // Ground scroll
      groundX = (groundX + speed) % 20;

      // Spawn prompts
      const spawnRate = Math.max(50, 100 - speed * 2);
      if (frame % spawnRate === 0) {
        spawnPrompt();
        if (Math.random() < 0.3) spawnCoffee();
      }

      // Spawn clouds
      if (frame % 150 === 0) {
        clouds.push({ x: 850, y: 20 + Math.random() * 60 });
      }

      // Move clouds
      clouds.forEach(c => c.x -= 1);
      clouds = clouds.filter(c => c.x > -100);

      // Move prompts
      prompts.forEach(p => {
        p.x -= speed;
        if (!p.passed && p.x + p.width < claude.x) {
          p.passed = true;
          score += 10;
        }
      });
      prompts = prompts.filter(p => p.x > -200);

      // Move coffees
      coffees.forEach(c => c.x -= speed);
      coffees = coffees.filter(c => c.x > -50 && !c.collected);

      // Collision with prompts
      const cx = claude.x;
      const cy = claude.y;
      const cw = 50;
      const ch = 60;

      prompts.forEach(p => {
        if (cx + 10 < p.x + p.width &&
            cx + cw - 10 > p.x &&
            cy + 10 < p.y + p.height &&
            cy + ch > p.y) {
          state = 'dead';
          if (score > highScore) {
            highScore = score;
            hiEl.textContent = formatScore(highScore);
          }
        }
      });

      // Coffee collection
      coffees.forEach(c => {
        if (!c.collected &&
            cx < c.x + 30 && cx + cw > c.x &&
            cy < c.y + 30 && cy + ch > c.y) {
          c.collected = true;
          score += 50;
        }
      });

      // Score tick
      if (frame % 6 === 0) score++;
      scoreEl.textContent = formatScore(score);
    }

    function drawClaude(x, y) {
      ctx.save();
      ctx.translate(x, y);

      // Antenna
      ctx.strokeStyle = '#6b7280';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(25, 5);
      ctx.lineTo(25, -12);
      ctx.stroke();
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(25, -15, 5, 0, Math.PI * 2);
      ctx.fill();

      // Body
      ctx.fillStyle = '#3f3f50';
      ctx.strokeStyle = '#6366f1';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.roundRect(5, 20, 40, 35, 8);
      ctx.fill();
      ctx.stroke();

      // Head
      ctx.beginPath();
      ctx.roundRect(0, 0, 50, 40, 10);
      ctx.fill();
      ctx.stroke();

      // Eyes
      const eyeH = claude.eyeBlink > 0 ? 1 : 6;
      ctx.fillStyle = '#a78bfa';
      ctx.shadowColor = '#a78bfa';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.ellipse(15, 18, 6, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.ellipse(35, 18, 6, eyeH, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Mouth bar
      ctx.fillStyle = '#1a1a1f';
      ctx.beginPath();
      ctx.roundRect(12, 28, 26, 6, 3);
      ctx.fill();
      ctx.fillStyle = '#f97316';
      const mouthW = 12 + Math.sin(frame * 0.1) * 8;
      ctx.beginPath();
      ctx.roundRect(14, 29, mouthW, 4, 2);
      ctx.fill();

      // Legs
      ctx.fillStyle = '#3f3f50';
      if (claude.grounded) {
        const legOffset = claude.runFrame === 0 ? 5 : -5;
        ctx.beginPath();
        ctx.roundRect(10, 55, 12, 18 + legOffset, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(28, 55, 12, 18 - legOffset, 4);
        ctx.fill();
      } else {
        // Tucked legs when jumping
        ctx.beginPath();
        ctx.roundRect(10, 52, 12, 12, 4);
        ctx.fill();
        ctx.beginPath();
        ctx.roundRect(28, 52, 12, 12, 4);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawPrompt(p) {
      // Glow
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 15;

      // Pill shape
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.roundRect(p.x, p.y, p.width, p.height, p.height / 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Text
      ctx.fillStyle = '#fff';
      ctx.font = '600 12px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, p.x + p.width / 2, p.y + p.height / 2);
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#1a1a1f';
      ctx.fillRect(0, 0, 800, 250);

      // Clouds
      ctx.fillStyle = '#2a2a35';
      clouds.forEach(c => {
        ctx.beginPath();
        ctx.arc(c.x, c.y, 20, 0, Math.PI * 2);
        ctx.arc(c.x + 25, c.y - 5, 25, 0, Math.PI * 2);
        ctx.arc(c.x + 50, c.y, 18, 0, Math.PI * 2);
        ctx.fill();
      });

      // Ground line
      ctx.strokeStyle = '#3f3f50';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 225);
      ctx.lineTo(800, 225);
      ctx.stroke();

      // Ground texture
      ctx.strokeStyle = '#2a2a35';
      ctx.lineWidth = 1;
      for (let i = -groundX; i < 820; i += 20) {
        ctx.beginPath();
        ctx.moveTo(i, 230);
        ctx.lineTo(i + 10, 230);
        ctx.stroke();
        if ((i + 10) % 60 === 0) {
          ctx.beginPath();
          ctx.moveTo(i + 5, 235);
          ctx.lineTo(i + 8, 235);
          ctx.stroke();
        }
      }

      // Coffees
      coffees.forEach(c => {
        if (c.collected) return;
        ctx.font = '28px serif';
        ctx.shadowColor = '#f59e0b';
        ctx.shadowBlur = 15;
        ctx.fillText('☕', c.x, c.y + 20);
        ctx.shadowBlur = 0;
      });

      // Prompts
      prompts.forEach(drawPrompt);

      // Claude
      drawClaude(claude.x, claude.y);

      // Game over
      if (state === 'dead') {
        ctx.fillStyle = '#fff';
        ctx.font = '600 24px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('GAME OVER', 400, 100);
        ctx.font = '14px Inter, sans-serif';
        ctx.fillStyle = '#888';
        ctx.fillText('Press SPACE to restart', 400, 130);
      }

      // Waiting state
      if (state === 'waiting') {
        ctx.fillStyle = '#fff';
        ctx.font = '600 20px Inter, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('Press SPACE to start', 400, 100);
        ctx.font = '13px Inter, sans-serif';
        ctx.fillStyle = '#666';
        ctx.fillText('Jump over the prompts, collect ☕ coffee', 400, 125);
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.code === 'ArrowUp') {
        e.preventDefault();
        jump();
      }
    });

    canvas.addEventListener('click', jump);
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      jump();
    });

    init();
    gameLoop();
  </script>
</body>
</html>
